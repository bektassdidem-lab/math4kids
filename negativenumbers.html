<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Below Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Lexend:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen app. Intro (sky above, soil below a 0 line) → Home (two zone doors) → Zone (model stage left, question card right) → Results.
   Colour rule used everywhere: positive numbers are warm (above zero), negative numbers are cold (below zero). */
:root{
  --ground:#e6ecf4;
  --surface:#ffffff;
  --stage:#f4f7fb;
  --ink:#18213a;
  --muted:#56637e;
  --line:#c8d2e1;
  --warm:#d9561a;
  --cold:#2462d6;
  --cold-soft:#a9c8ff;
  --zero:#7d879b;
  --brass:#f2b02e;
  --ok:#14915c;
  --ok-soft:#dcf3e8;
  --bad:#c92f46;
  --bad-soft:#fbe2e6;
  --sky:#cfe4fb;
  --facade:#dde5ef;
  --frame:#93a6c2;
  --soil:#6c4f3e;
  --soil-deep:#5a4133;
  --grass:#46a157;
  --shaft:#2b3550;
  --led-dim:#a6b3c9;
  --hover:rgba(242,176,46,.18);
  --rowline:rgba(24,33,58,.14);
  --on-accent:#ffffff;
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Lexend","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;font-size:clamp(15px,0.85vw + 8px,24px);background:#e2f0ff}
body{height:100%;margin:0;background:linear-gradient(180deg,#bfe0ff 0%,#e2f0ff 50%,#f4f9ff 100%) fixed;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{height:100%;position:relative;z-index:1}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,.hit:focus-visible{outline:4px solid var(--brass);outline-offset:3px}
.screen{height:100%;position:relative;box-sizing:border-box;padding-inline:clamp(16px,2.5vw,48px);padding-block:clamp(14px,2vh,32px);display:flex;flex-direction:column}
.num{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.num.pos{color:var(--warm)} .num.neg{color:var(--cold)} .num.zero{color:var(--ink)}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin:0}
.sig{position:absolute;right:clamp(16px,2.5vw,44px);bottom:calc(clamp(12px,2vh,28px) + env(safe-area-inset-bottom,0px));font-family:var(--f-display);font-weight:600;font-size:1.15rem;letter-spacing:.08em;color:var(--muted);pointer-events:none}
.btn-big{font-family:var(--f-display);font-weight:600;font-size:clamp(1.2rem,2vw,1.8rem);letter-spacing:.04em;background:var(--brass);color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:.55em 1.7em;box-shadow:0 6px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn-big:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
.btn-big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn-ghost{font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.04em;background:transparent;border:3px solid var(--ink);border-radius:999px;padding:.55em 1.3em}
.btn-ghost:hover{background:var(--surface)}

/* ---------- Intro ---------- */
#intro{padding:0;overflow:hidden;background:var(--soil)}
.intro-half{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;padding-inline:clamp(16px,4vw,64px);text-align:center}
.intro-half.sky{background:var(--sky);justify-content:flex-end;padding-bottom:clamp(1rem,4vh,2.6rem);gap:.6rem}
.intro-half.soil{background:linear-gradient(var(--soil),var(--soil-deep));justify-content:flex-start;padding-top:clamp(1rem,3.5vh,2.4rem);gap:clamp(1rem,3vh,2rem);color:var(--surface)}
.intro-half.sky .eyebrow{color:var(--muted)}
.tagline{margin:0;font-size:clamp(1.05rem,1.6vw,1.45rem);max-width:34ch;text-wrap:balance}
.sun{position:absolute;top:12%;right:12%;width:clamp(4rem,9vw,8rem);aspect-ratio:1;border-radius:50%;background:var(--brass);box-shadow:0 0 0 .8rem rgba(242,176,46,.25)}
.skyline{position:absolute;bottom:0;left:clamp(5.5rem,14vw,14rem);display:flex;align-items:flex-end;gap:.5rem}
.skyline i{display:block;width:clamp(1.6rem,3vw,3rem);background:var(--facade);border:3px solid var(--frame);border-bottom:0;border-radius:4px 4px 0 0}
.zero-line{height:12px;background:var(--grass);position:relative;z-index:1}
.zero-line span{position:absolute;left:clamp(16px,4vw,64px);top:50%;transform:translateY(-50%);background:var(--ink);color:var(--surface);font-weight:800;font-size:1.3rem;width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center}
.ruler{position:absolute;left:clamp(16px,4vw,64px);width:2.4rem;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:clamp(.9rem,1.4vw,1.25rem);font-variant-numeric:tabular-nums}
.ruler span{height:clamp(1.6rem,4.2vh,2.6rem);display:grid;place-items:center}
.sky .ruler{bottom:1.6rem;color:var(--warm)}
.soil .ruler{top:1.6rem;color:var(--cold-soft)}
.intro-half.sky{flex:.85}
.intro-half.soil{flex:1.15;overflow:auto}
#btnStart{position:relative;z-index:2;flex:none}
.title{font-family:var(--f-display);font-weight:700;font-size:4.5rem;font-size:clamp(2.6rem,min(10vw,13vh),8rem);line-height:.88;margin:0;color:var(--cold-soft);letter-spacing:.02em;text-shadow:0 .06em 0 var(--ink)}

/* ---------- Home ---------- */
#home{gap:clamp(1rem,2.5vh,2rem);overflow:auto}
.home-head{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,3.6vw,3rem);margin:0;line-height:1}
.brand .b{color:var(--cold)}
.home-head p{margin:0;color:var(--muted);font-size:1.1rem}
.doors{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(1rem,2.5vw,2.6rem);min-height:0;padding-bottom:3.2rem}
.door{border:4px solid var(--ink);border-radius:1.6rem;background:var(--surface);display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;box-shadow:0 8px 0 var(--ink);transition:transform .15s,box-shadow .15s;min-height:0}
.door:hover{transform:translateY(-4px);box-shadow:0 12px 0 var(--ink)}
.door:active{transform:translateY(4px);box-shadow:0 4px 0 var(--ink)}
.door-art{flex:1;min-height:10rem;display:grid;place-items:center;position:relative;width:100%}
.art-tower{background:linear-gradient(var(--sky) 0 50%,var(--soil) 50% 100%)}
.art-tower::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 4px);height:8px;background:var(--grass)}
.mini{display:flex;flex-direction:column;border:3px solid var(--ink);border-radius:.5rem;overflow:hidden;width:min(70%,13rem);position:relative;z-index:1}
.mini div{display:flex;align-items:stretch;height:clamp(1.4rem,3.4vh,2.1rem);font-weight:800;font-size:.95rem}
.mini div span{width:2.6rem;flex:none;display:grid;place-items:center}
.mini .p{background:var(--facade);color:var(--warm)}
.mini .z{background:var(--facade);color:var(--ink)}
.mini .n{background:var(--soil);color:var(--cold-soft)}
.mini div::after{content:"";width:22%;flex:none;background:var(--shaft);border-left:3px solid var(--ink)}
.mini div em{flex:1;margin:.3rem 1rem;background:repeating-linear-gradient(90deg,#cfe8ff 0 1.2rem,transparent 1.2rem 1.8rem);border-radius:2px}
.mini .n em{background:transparent;border:0}
.mini .car-mini{position:absolute;right:0;width:22%;top:calc(3 * 100% / 5);height:calc(100%/5);background:var(--brass);border:2px solid var(--ink);box-sizing:border-box;animation:minicar 5s ease-in-out infinite}
@keyframes minicar{0%,15%{top:calc(2*100%/5)}35%,55%{top:calc(4*100%/5)}75%,90%{top:0}100%{top:calc(2*100%/5)}}
.art-order{background:linear-gradient(#f3f9ff,#d6e9fd)}
.chips{display:flex;align-items:center;gap:.3rem;flex-wrap:nowrap;justify-content:center;padding:1rem}
.chips .c{width:clamp(2.4rem,3.7vw,3.6rem);aspect-ratio:1;border:3px solid var(--ink);border-radius:.8rem;background:var(--surface);display:grid;place-items:center;font-size:clamp(1.1rem,2vw,1.6rem);box-shadow:0 4px 0 var(--ink)}
.chips .c.q{border-style:dashed;color:var(--muted);font-weight:800}
.art-seq{background:linear-gradient(#eef8ff,#cde6fb)}
.chips .r{font-weight:800;font-size:1.5rem;color:var(--muted)}
.door-txt{padding:1.1rem 1.4rem 1.4rem;display:flex;flex-direction:column;gap:.35rem;border-top:4px solid var(--ink)}
.door-txt .eyebrow{color:var(--muted)}
.door h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.4rem,2.5vw,2.2rem);margin:0;line-height:1.05}
.door p{margin:0;color:var(--muted);max-width:40ch}
.best{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.95rem;margin-top:.3rem}
.stars{display:inline-flex;gap:.15em}
.st svg{width:1.2em;height:1.2em;display:block;fill:var(--line)}
.st.on svg{fill:var(--brass);stroke:var(--ink);stroke-width:1.2}
.st.lg svg{width:clamp(3rem,7vw,5rem);height:clamp(3rem,7vw,5rem)}

/* ---------- Zone ---------- */
#zone{gap:clamp(.7rem,1.6vh,1.2rem)}
.topbar{display:flex;align-items:center;gap:.8rem 1rem;flex-wrap:wrap}
.tb-btn{border:3px solid var(--ink);background:var(--surface);border-radius:999px;padding:.35rem .95rem;font-weight:700;font-size:.95rem}
.tb-btn:hover{background:var(--brass)}
.tb-title{font-family:var(--f-display);font-weight:600;font-size:clamp(1rem,1.7vw,1.4rem)}
.dots{display:flex;gap:.45rem;list-style:none;padding:.25rem .9rem;margin:0 auto;flex:0 1 auto;justify-content:center;align-items:center;flex-wrap:wrap;min-width:0;min-height:2.4rem;box-sizing:border-box;background:rgba(255,255,255,.6);border:2px solid #cfe2f7;border-radius:999px}
.dots li{width:1.05rem;height:1.05rem;box-sizing:border-box;border-radius:.35rem;background:#eaf4ff;border:2px solid var(--cold-soft);display:grid;place-items:center;line-height:1}
.dots li.cur{width:2rem;height:2.3rem;border:0;background:none}
.dots li.cur .peng{height:100%;width:auto}
.dots li.y{background:var(--brass);border-color:#c98a10;border-radius:50%}
.dots li.y::after{content:"\2605";color:#fff;font-size:.62rem}
.dots li.n{background:#dde5f0;border-color:#b3c1d5;border-radius:50%}
.tb-score{display:flex;align-items:center;gap:.35rem;font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}
.tb-score svg{width:1.4rem;height:1.4rem;fill:var(--brass);stroke:var(--ink);stroke-width:1.2}
.zone-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:clamp(.8rem,1.8vw,1.6rem)}
.stage{background:linear-gradient(#f9fcff,#e6f1fd);border:3px solid #bcd6f2;border-radius:1.3rem;position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;padding:clamp(.8rem,1.6vw,1.4rem)}
.stage-tag{align-self:flex-start;font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--surface);padding:.25rem .7rem;border-radius:.4rem}
.stage-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:.6rem}
.panel{background:var(--surface);border:3px solid var(--ink);border-radius:1.3rem;padding:clamp(1rem,1.8vw,1.6rem);display:flex;flex-direction:column;gap:.9rem;min-height:0;min-width:0;overflow:auto;box-shadow:0 6px 0 var(--ink),0 18px 40px rgba(36,98,214,.16);align-self:center;min-height:min(26rem,100%);max-height:100%;box-sizing:border-box}
.q-kicker{font-family:var(--f-display);font-weight:600;font-size:.75rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.q-title{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,2.3vw,2.4rem);line-height:1.08;margin:0;text-wrap:balance}
.q-text{font-size:clamp(1.1rem,1.5vw,1.4rem);margin:0;text-wrap:pretty}
.q-text small{display:block;color:var(--muted);font-size:.8em;margin-top:.3rem}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.stack{display:flex;flex-direction:column;gap:.8rem}
.opt{border:3px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);border-radius:.9rem;padding:.6rem .4rem;font-size:clamp(1.5rem,2.4vw,2.2rem);font-weight:800;transition:border-color .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateY(-2px)}
.opt.ok{background:var(--ok);border-color:var(--ok)}
.opt.ok .num,.opt.ok{color:var(--on-accent)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
.opt.sign small{display:block;font-size:.72rem;font-weight:500;color:var(--muted);letter-spacing:.01em}
.opt.sign.ok small{color:var(--on-accent)}
.expr{display:flex;align-items:center;justify-content:center;gap:clamp(.6rem,1.5vw,1.2rem);font-size:clamp(2.2rem,4vw,3.4rem);font-weight:800;padding:.5rem;background:var(--stage);border-radius:1rem}
.expr .slot{width:1.35em;height:1.35em;border:4px dashed var(--muted);border-radius:.35em;display:grid;place-items:center;color:var(--muted);font-size:.85em}
.expr .slot.filled{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.row-actions{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.btn-check{font-family:var(--f-display);font-weight:600;font-size:1.1rem;letter-spacing:.04em;background:var(--brass);border:3px solid var(--ink);border-radius:999px;padding:.5em 1.6em;box-shadow:0 4px 0 var(--ink)}
.btn-check:disabled{opacity:.45;box-shadow:none}
.feedback{display:flex;gap:.55rem;align-items:flex-end;font-size:clamp(1rem,1.3vw,1.2rem)}
.feedback>.peng{flex:none;width:clamp(3rem,4.2vw,4.3rem);height:auto}
.feedback .bubble{flex:1;min-width:0;position:relative;background:var(--surface);border:3px solid var(--line);border-radius:1.1rem;padding:.7rem 1rem;box-shadow:0 4px 0 rgba(24,33,58,.1);animation:bubble-in .28s ease-out}
.feedback .bubble::before{content:"";position:absolute;left:-11px;bottom:14px;width:16px;height:16px;background:inherit;border:inherit;border-width:0 0 3px 3px;border-radius:0 0 0 4px;transform:rotate(45deg)}
.feedback.ok .bubble{border-color:var(--ok);background:var(--ok-soft)}
.feedback.bad .bubble{border-color:var(--bad);background:var(--bad-soft)}
.feedback.info .bubble{border-color:var(--cold-soft);background:#eef5ff}
@keyframes bubble-in{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.feedback .arw{color:var(--muted);font-weight:600;margin-inline:.2em}
.btn-next{align-self:flex-start;background:var(--ink);color:var(--surface);border:0;border-radius:999px;padding:.7rem 1.7rem;font-family:var(--f-display);font-weight:600;font-size:1.1rem;letter-spacing:.04em;box-shadow:0 4px 0 var(--brass)}
.btn-next:hover{transform:translateY(-2px)}
.gloss{margin-top:auto;border-top:3px dashed var(--line);padding-top:.8rem;display:flex;flex-direction:column;gap:.35rem;font-size:.9rem;color:var(--muted)}
#gloss{display:none}
.gloss .eyebrow{font-size:.7rem;color:var(--ink)}
.gloss ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.25rem}
.gloss b{color:var(--ink)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* readout chip used by every model */
.readout{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--ink);border-radius:.6rem;padding:.3rem .9rem;min-width:min(100%,14rem);box-sizing:border-box}
.readout .k{font-family:var(--f-display);font-weight:600;font-size:.72rem;letter-spacing:.12em;color:var(--led-dim)}
.readout .v{font-weight:800;font-size:clamp(1.4rem,2.6vw,2rem);font-variant-numeric:tabular-nums;color:var(--brass);min-width:4ch;text-align:right}

/* elevator */
.elev{height:100%;width:min(100%,34rem);display:flex;flex-direction:column;gap:.6rem;align-items:stretch}
.tower{flex:1;min-height:0;position:relative;display:grid;grid-template-rows:repeat(11,minmax(0,1fr));border:3px solid var(--ink);border-radius:1rem 1rem .4rem .4rem;overflow:hidden;background:var(--soil)}
.fl{border:0;margin:0;padding:0;display:grid;grid-template-columns:24% minmax(0,1fr) 24%;min-height:0;text-align:left;position:relative;background:var(--facade)}
.fl + .fl{box-shadow:inset 0 1px 0 var(--rowline)}
.fl.neg{background:var(--soil)}
.fl.neg:nth-child(even){background:var(--soil-deep)}
.fl.zero::after{content:"";position:absolute;left:0;right:24%;bottom:0;height:5px;background:var(--grass)}
.fl-num{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(1rem,3vh,2.1rem);font-variant-numeric:tabular-nums;margin:6% 8%;border-radius:.4rem}
.fl.pos .fl-num{color:var(--warm)} .fl.neg .fl-num{color:var(--cold-soft)} .fl.zero .fl-num{color:var(--ink)}
.fl-room{display:flex;align-items:stretch;justify-content:center;padding:2px 3%;min-width:0;min-height:0;overflow:hidden}
.room-art{width:100%;height:100%;display:block}
.fl-shaft{background:var(--shaft);border-left:3px solid var(--ink)}
.fl:hover:not(:disabled) .fl-room,.fl:hover .fl-num{background-color:var(--hover)}
.fl:focus-visible{outline:4px solid var(--brass);outline-offset:-4px}
.fl.start .fl-num{outline:3px dashed var(--brass);outline-offset:-2px}
.fl.ok .fl-num{background:var(--ok);color:var(--on-accent)}
.fl.bad .fl-num{background:var(--bad);color:var(--on-accent)}
.fl.bad{animation:shake .4s}
.car{position:absolute;right:0;width:24%;top:calc(var(--i,5) * 100% / 11);height:calc(100% / 11);transition:top .32s ease-in-out;padding:3px 6px;box-sizing:border-box;pointer-events:none}
.cab{display:flex;justify-content:center;align-items:flex-end;height:100%;box-sizing:border-box;background:linear-gradient(#ffd66b,#f2b02e);border:2px solid var(--ink);border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.cab .peng{height:90%;width:auto}

/* thermometer */
.thermo{height:100%;width:100%;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.th-wrap{flex:1;min-height:0;width:100%;position:relative;display:flex;justify-content:center;border-radius:1rem;overflow:hidden;background:linear-gradient(#e3f1ff,#f7fbff)}
.th-wrap::before,.th-wrap::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .5s}
.th-wrap::before{background:linear-gradient(#ffd98a,#fff4d9)}
.th-wrap::after{background:linear-gradient(#a6c9f2,#eaf3fd)}
.th-wrap[data-sign="pos"]::before,.th-wrap[data-sign="neg"]::after{opacity:1}
.th-sun{position:absolute;top:7%;left:7%;width:clamp(3rem,6vw,5rem);aspect-ratio:1;border-radius:50%;background:#ffc53d;box-shadow:0 0 0 .6rem rgba(255,197,61,.3),0 0 2.4rem 1rem rgba(255,197,61,.35);opacity:0;transform:scale(.5);transition:opacity .5s,transform .5s;z-index:1}
.th-wrap[data-sign="pos"] .th-sun{opacity:1;transform:none}
.th-snow{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity .5s;background-image:radial-gradient(circle at 20% 30%,#fff 0 3px,transparent 3.6px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.9) 0 2px,transparent 2.6px),radial-gradient(circle at 45% 85%,rgba(255,255,255,.8) 0 1.6px,transparent 2.2px);background-size:73px 61px,97px 89px,53px 47px;animation:snowfall 6s linear infinite}
.th-wrap[data-sign="neg"] .th-snow{opacity:1}
@keyframes snowfall{to{background-position:24px 244px,-18px 267px,10px 235px}}
.th-wrap>svg.th{position:relative;z-index:2;height:100%;width:100%;max-width:30rem}
.th-peng{position:absolute;right:5%;bottom:4%;width:clamp(3.6rem,11vw,10rem);z-index:3}
.th .tube{fill:var(--surface);stroke:var(--ink);stroke-width:4}
.th .liq{fill:var(--zero);transition:fill .3s}
.th[data-sign="pos"] .liq{fill:var(--warm)}
.th[data-sign="neg"] .liq{fill:var(--cold)}
.th .tk line{stroke:var(--ink);stroke-width:3}
.th .tk text{font-family:var(--f-body);font-weight:700;font-size:22px;fill:var(--zero)}
.th .tk.pos text{fill:var(--warm)} .th .tk.neg text{fill:var(--cold)}
.th .tk .arrow{fill:transparent}
.th .tk.start .arrow{fill:var(--brass);stroke:var(--ink);stroke-width:2}
.th .tk.ok .arrow{fill:var(--ok)} .th .tk.ok text{fill:var(--ok);font-size:26px}
.th .tk.bad .arrow{fill:var(--bad)} .th .tk.bad text{fill:var(--bad)}
.th .cap{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;fill:var(--muted)}
.th .tk text.note{font-family:var(--f-body);font-weight:600;font-size:12px;fill:var(--muted)}
.hit{fill:transparent;cursor:pointer;outline:none}
.hit:hover,.hit:focus-visible{fill:var(--hover)}

/* number line */
.nlwrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:.8rem}
.nl{width:100%;height:auto;max-height:100%;overflow:visible}
.nl .axis{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.nl .ah{fill:var(--ink)}
.nl .tk line{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.nl .tk text{font-family:var(--f-body);font-weight:800;fill:var(--zero)}
.nl .tk.pos text{fill:var(--warm)} .nl .tk.neg text{fill:var(--cold)}
.nl .ring{fill:transparent;stroke:transparent;stroke-width:4}
.nl .tk.start .ring{stroke:var(--brass);stroke-dasharray:7 5}
.nl .tk.ok .ring{fill:var(--ok);stroke:var(--ok)} .nl .tk.ok text{fill:var(--on-accent)}
.nl .tk.bad .ring{fill:var(--bad);stroke:var(--bad)} .nl .tk.bad text{fill:var(--on-accent)}
.nl .side{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.08em;fill:var(--muted)}
.nl .arc{fill:none;stroke:var(--brass);stroke-width:5;stroke-linecap:round}
.nl .arc-n{font-family:var(--f-body);font-weight:700;font-size:20px;fill:var(--muted)}
.nl .token .tk-mark{fill:var(--brass);stroke:var(--ink);stroke-width:3}
.nl .pt{stroke:var(--surface);stroke-width:4}
.nl .pt.pos{fill:var(--warm)} .nl .pt.neg{fill:var(--cold)} .nl .pt.zero{fill:var(--ink)}
.nl .pt-lbl rect{fill:var(--surface);stroke-width:3}
.nl .pt-lbl.pos rect{stroke:var(--warm)} .nl .pt-lbl.neg rect{stroke:var(--cold)} .nl .pt-lbl.zero rect{stroke:var(--ink)}
.nl .pt-lbl text{font-family:var(--f-body);font-weight:800;font-size:26px}
.nl .pt-lbl.pos text{fill:var(--warm)} .nl .pt-lbl.neg text{fill:var(--cold)} .nl .pt-lbl.zero text{fill:var(--ink)}
.nl .pt-lbl.win rect{fill:var(--ok);stroke:var(--ok)} .nl .pt-lbl.win text{fill:var(--on-accent)}
.nl .stem{stroke:var(--line);stroke-width:3}
.legend{display:flex;gap:1.4rem;flex-wrap:wrap;justify-content:center;font-weight:600;color:var(--muted);font-size:.95rem}

/* think card */
.think{text-align:center;display:flex;flex-direction:column;gap:.8rem;align-items:center;max-width:30rem}
.think-k{font-family:var(--f-display);font-weight:600;font-size:clamp(1.3rem,2.4vw,2rem);margin:0}
.think-t{margin:0;font-size:1.2rem;color:var(--muted)}
.think-line{display:flex;align-items:center;gap:.6rem;width:100%;font-weight:700;color:var(--muted)}
.think-line i{flex:1;height:5px;background:var(--ink);border-radius:3px;position:relative}
.think-line i::before,.think-line i::after{content:"";position:absolute;top:50%;width:0;height:0;border:9px solid transparent;transform:translateY(-50%)}
.think-line i::before{left:-14px;border-right-color:var(--ink)}
.think-line i::after{right:-14px;border-left-color:var(--ink)}

/* ordering board */
.board{width:100%;max-width:62rem;display:flex;flex-direction:column;gap:clamp(.8rem,2vh,1.4rem);align-items:center}
.board-dir{font-family:var(--f-display);font-weight:600;font-size:clamp(.95rem,1.6vw,1.3rem);letter-spacing:.06em;color:var(--muted);text-align:center}
.slots{display:flex;align-items:flex-start;gap:.35rem;flex-wrap:wrap;justify-content:center}
.slot-w{display:flex;flex-direction:column;align-items:center;gap:.3rem}
.slot,.card{width:clamp(3.4rem,8vw,7rem);height:clamp(3.4rem,8vw,7rem);aspect-ratio:1;max-width:100%;box-sizing:border-box;border-radius:1rem;font-size:clamp(1.4rem,3vw,2.9rem);font-weight:800;display:grid;place-items:center;padding:0}
.slot{border:4px dashed #9cc1ea;background:rgba(255,255,255,.75)}
.slot.filled{border-style:solid;border-color:#5c8fd1;background:linear-gradient(155deg,#fff,#dcedff)}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.slot-cap{font-size:.72rem;color:var(--muted);min-height:1.2em;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.board.n5 .slot,.board.n5 .card{width:clamp(2.8rem,6.2vw,5.8rem);height:clamp(2.8rem,6.2vw,5.8rem);font-size:clamp(1.2rem,2.6vw,2.4rem)}
.board.n5 .rel{width:.8em;height:clamp(2.8rem,6.2vw,5.8rem)}
.board.n5 .slots{gap:.25rem}
.rel{width:1.2em;height:clamp(3.4rem,8vw,7rem);display:grid;place-items:center;font-size:clamp(1.4rem,2.6vw,2.2rem);font-weight:800;color:var(--muted)}
.pool{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;padding:1rem 1.2rem 1.3rem;background:linear-gradient(#f4f9ff,#e2effd);border:3px dashed #a9c8ee;border-radius:1.2rem}
.card{position:relative;border:3px solid #5c8fd1;background:linear-gradient(155deg,#fff 0%,#e3f1ff 55%,#c6e0ff 100%);box-shadow:0 5px 0 #5c8fd1,inset 0 0 0 3px rgba(255,255,255,.7);transition:transform .12s}
.card::after{content:"";position:absolute;top:10%;left:12%;width:30%;height:13%;border-radius:999px;background:rgba(255,255,255,.95);transform:rotate(-20deg);pointer-events:none}
.card:hover:not(:disabled){transform:translateY(-3px)}
.card.used{opacity:.18;box-shadow:none}
.reveal{width:100%;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.reveal-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:center;font-size:1.6rem}
.reveal-row .r{color:var(--muted);font-weight:800}

/* results */
#result{align-items:center;justify-content:center}
.result-card{background:var(--surface);border:4px solid var(--ink);border-radius:1.8rem;box-shadow:0 10px 0 var(--ink);padding:clamp(1.5rem,4vw,3rem);display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center;max-width:36rem;width:100%;box-sizing:border-box}
.result-card .eyebrow{color:var(--muted)}
.result-card h2{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,5vw,3.4rem);margin:0;line-height:1}
.result-card p{margin:0;font-size:1.2rem}
.res-actions{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:.6rem}

/* ---------- Zone 3: sequences ---------- */
.seq{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(.6rem,2.5vh,1.8rem)}
.seq-row{position:relative;display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;max-width:100%;padding-top:clamp(3.4rem,9vh,5.6rem)}
.stone{flex:none;width:clamp(2.4rem,6.4vw,6rem);height:clamp(2rem,5.3vw,5rem);padding:0;box-sizing:border-box;border-radius:50%;border:3px solid #5c8fd1;background:radial-gradient(ellipse at 35% 28%,#fff 0 16%,#e8f3ff 42%,#c2ddfb 100%);box-shadow:0 6px 0 #5c8fd1;display:grid;place-items:center;font-size:clamp(1rem,2.5vw,2.4rem);font-weight:800;color:var(--ink);cursor:default}
.stone.blank{border-style:dashed;background:#fff;color:var(--muted);cursor:pointer}
.stone.blank.active{border-style:solid;border-color:var(--brass);box-shadow:0 6px 0 #c98a10,0 0 0 6px rgba(242,176,46,.35)}
.stone.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft);box-shadow:0 6px 0 var(--ok)}
.stone.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft);box-shadow:0 6px 0 var(--bad);animation:shake .4s}
.seq-gap{flex:none;width:clamp(1rem,3vw,3rem);text-align:center;font-weight:800;font-size:clamp(1rem,2vw,1.8rem);color:var(--muted)}
.seq-gap.on{font-size:clamp(.7rem,1.15vw,1.05rem);color:var(--ink)}
.seq-gap.on span{display:inline-block;background:#fff3d1;border:2px solid var(--brass);border-radius:999px;padding:.1em .35em;white-space:nowrap}
.seq-pip{position:absolute;left:0;top:0;width:clamp(2.6rem,5vw,4.6rem);pointer-events:none}
.seq-line{width:100%}
.nl .sq-blank{fill:#fff;stroke:var(--brass);stroke-width:4;stroke-dasharray:6 4}
.nl .sq-step{font-family:var(--f-body);font-weight:800;font-size:24px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
.keypad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.4rem}
.key{border:3px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);border-radius:.8rem;font-size:clamp(1.2rem,1.8vw,1.7rem);font-weight:800;padding:.35rem 0;transition:transform .08s}
.key:hover{border-color:var(--ink)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.minus{color:var(--cold);background:#eef5ff}
.key.back{color:var(--muted)}
.seq-keys{display:flex;flex-direction:column;gap:.8rem}

/* ---------- Pip the penguin ---------- */
svg.peng{display:block;overflow:visible}
.peng .pg-move,.peng .pg-shiv,.peng .pg-wl,.peng .pg-wr,.peng .pg-eo{transform-box:fill-box}
.peng .pg-move{transform-origin:50% 100%;animation:pg-bob 2.6s ease-in-out infinite}
.peng .pg-wl{transform-origin:70% 8%} .peng .pg-wr{transform-origin:30% 8%}
.peng .pg-eh,.peng .pg-br,.peng .pg-mo,.peng .pg-sc,.peng .pg-sw,.peng .pg-q{display:none}
.peng.mood-happy .pg-eo{display:none}
.peng.mood-happy .pg-eh,.peng.mood-happy .pg-mo{display:inline}
.peng.mood-happy .pg-move{animation:pg-hop .7s ease-in-out infinite}
.peng.mood-happy .pg-wl{animation:pg-flapL .35s ease-in-out infinite alternate}
.peng.mood-happy .pg-wr{animation:pg-flapR .35s ease-in-out infinite alternate}
.peng.mood-oops .pg-br,.peng.mood-oops .pg-sw{display:inline}
.peng.mood-oops .pg-move{animation:pg-oops .55s ease-in-out 1}
.peng.mood-think .pg-q{display:inline}
.peng.mood-think .pg-eo{transform:translate(1.5px,-2.5px)}
.peng.mood-think .pg-move{animation:pg-tilt 1.8s ease-in-out infinite}
.peng.temp-cold .pg-sc{display:inline}
.peng.temp-cold .pg-shiv{animation:pg-shiver .14s linear infinite}
.peng.temp-hot .pg-sw{display:inline}
.peng.temp-hot .pg-ch{fill:#ff5c7a}
@keyframes pg-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes pg-hop{0%,100%{transform:translateY(0) scaleY(1)}15%{transform:translateY(0) scaleY(.92)}50%{transform:translateY(-14%) scaleY(1.03)}85%{transform:translateY(0) scaleY(.96)}}
@keyframes pg-flapL{from{transform:rotate(0)}to{transform:rotate(40deg)}}
@keyframes pg-flapR{from{transform:rotate(0)}to{transform:rotate(-40deg)}}
@keyframes pg-oops{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
@keyframes pg-tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes pg-shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5%)}75%{transform:translateX(1.5%)}}

/* clouds behind every screen */
.clouds{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.clouds i{position:absolute;left:-16em;width:13em;height:3.6em;background:#fff;border-radius:999px;opacity:.8;font-size:16px;animation:drift linear infinite}
.clouds i::before,.clouds i::after{content:"";position:absolute;background:#fff;border-radius:50%}
.clouds i::before{width:5.5em;height:5.5em;left:2em;top:-2.6em}
.clouds i::after{width:4em;height:4em;left:6.4em;top:-1.8em}
.clouds i:nth-child(1){top:12%;animation-duration:90s;animation-delay:-25s}
.clouds i:nth-child(2){top:48%;font-size:11px;opacity:.65;animation-duration:120s;animation-delay:-80s}
.clouds i:nth-child(3){top:80%;font-size:13px;opacity:.7;animation-duration:105s;animation-delay:-50s}
@keyframes drift{to{transform:translateX(calc(100vw + 34em))}}

/* mascot spots */
.intro-peng{position:absolute;bottom:0;right:24%;width:clamp(4.5rem,9vw,8.5rem);z-index:2}
.home-mascot{display:flex;align-items:flex-end;gap:.5rem;margin-left:auto}
.hm-peng{width:clamp(3rem,5vw,4.4rem);flex:none}
.home-head p.hm-bubble{margin:0 0 1.2rem;color:var(--ink);background:var(--surface);border:3px solid var(--ink);border-radius:1rem;padding:.5rem .9rem;font-size:1rem;position:relative;max-width:22rem;box-shadow:0 4px 0 var(--ink)}
.hm-bubble::after{content:"";position:absolute;right:-10px;bottom:12px;width:14px;height:14px;background:var(--surface);border:3px solid var(--ink);border-width:3px 3px 0 0;transform:rotate(45deg)}
.door-peng{position:absolute;right:5%;bottom:6%;width:clamp(2.6rem,4.5vw,4rem)}
.stage-peng{position:absolute;top:.5rem;right:.8rem;width:clamp(2.8rem,5.5vw,5.6rem);z-index:2;pointer-events:none}
.res-peng{width:clamp(5rem,12vw,8rem);margin-bottom:-.4rem}

/* reward effects */
.fx{position:fixed;left:0;top:0;z-index:50;pointer-events:none;font-size:1.6rem;line-height:1;will-change:transform,opacity}
.fly-star{position:fixed;left:0;top:0;z-index:51;width:2.6rem;height:2.6rem;pointer-events:none}
.fly-star svg{width:100%;height:100%;fill:var(--brass);stroke:var(--ink);stroke-width:1.2}
.tb-score.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.4)}}

@media (max-width:820px){
  .screen{height:auto;min-height:100%}
  #intro{height:100%}
  .zone-main{grid-template-columns:minmax(0,1fr)}
  .stage{height:min(68vh,560px)}
  .stage.compact{height:auto;min-height:14rem}
  .panel{overflow:visible;align-self:stretch;min-height:0;max-height:none}
  .doors{grid-template-columns:minmax(0,1fr)}
  .skyline{display:none}
}
@media (max-width:520px){
  .ruler,.zero-line span{display:none}
  .opts.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .intro-peng{right:6%}
  .home-mascot{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="clouds" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="app">
  <!-- INTRO -->
  <section id="intro" class="screen">
    <div class="intro-half sky">
      <div class="sun" aria-hidden="true"></div>
      <div class="skyline" aria-hidden="true"><i style="height:5rem"></i><i style="height:8rem"></i><i style="height:3.5rem"></i></div>
      <div class="ruler" aria-hidden="true"><span>+5</span><span>+4</span><span>+3</span><span>+2</span><span>+1</span></div>
      <div class="intro-peng" data-peng="happy" aria-hidden="true"></div>
      <p class="eyebrow">Grade 4 · Negative numbers</p>
      <p class="tagline">Ride the elevator, read the thermometer and put numbers in order, above and below zero.</p>
    </div>
    <div class="zero-line"><span>0</span></div>
    <div class="intro-half soil">
      <div class="ruler" aria-hidden="true"><span>−1</span><span>−2</span><span>−3</span><span>−4</span><span>−5</span></div>
      <h1 class="title">Below<br>Zero</h1>
      <button class="btn-big" id="btnStart">Start</button>
    </div>
    <div class="sig" style="color:var(--cold-soft)">Didem İnce</div>
  </section>

  <!-- HOME -->
  <section id="home" class="screen" hidden>
    <header class="home-head">
      <h1 class="brand">Below <span class="b">Zero</span></h1>
      <div class="home-mascot"><p class="hm-bubble">Hi, I'm <b>Pip</b>! Pick a zone and let's go below zero.</p><div class="hm-peng" data-peng="idle" aria-hidden="true"></div></div>
    </header>
    <div class="doors">
      <button class="door" id="doorTower">
        <div class="door-art art-tower" aria-hidden="true">
          <div class="mini">
            <div class="p"><span>+2</span><em></em></div>
            <div class="p"><span>+1</span><em></em></div>
            <div class="z"><span>0</span><em></em></div>
            <div class="n"><span>−1</span><em></em></div>
            <div class="n"><span>−2</span><em></em></div>
            <i class="car-mini"></i>
          </div>
        </div>
        <div class="door-txt">
          <span class="eyebrow">Zone 1 · 12 questions</span>
          <h2>Number Tower</h2>
          <p>Meet negative numbers on an elevator, a thermometer and a number line.</p>
          <span class="best" id="best-tower"></span>
        </div>
      </button>
      <button class="door" id="doorOrder">
        <div class="door-art art-order" aria-hidden="true">
          <div class="door-peng" data-peng="idle"></div>
          <div class="chips">
            <span class="c"><b class="num neg">−6</b></span><span class="r">&lt;</span>
            <span class="c"><b class="num neg">−2</b></span><span class="r">&lt;</span>
            <span class="c"><b class="num zero">0</b></span><span class="r">&lt;</span>
            <span class="c"><b class="num pos">3</b></span>
          </div>
        </div>
        <div class="door-txt">
          <span class="eyebrow">Zone 2 · 10 questions</span>
          <h2>Compare &amp; Order</h2>
          <p>Compare numbers and put them in increasing or decreasing order.</p>
          <span class="best" id="best-order"></span>
        </div>
      </button>
      <button class="door" id="doorSeq">
        <div class="door-art art-seq" aria-hidden="true">
          <div class="chips">
            <span class="c"><b class="num pos">6</b></span><span class="r">,</span>
            <span class="c"><b class="num pos">2</b></span><span class="r">,</span>
            <span class="c q">?</span><span class="r">,</span>
            <span class="c"><b class="num neg">−6</b></span>
          </div>
        </div>
        <div class="door-txt">
          <span class="eyebrow">Zone 3 · 10 questions</span>
          <h2>Sequences</h2>
          <p>Count forwards and backwards in steps and fill in the missing negative numbers.</p>
          <span class="best" id="best-seq"></span>
        </div>
      </button>
    </div>
    <div class="sig">Didem İnce</div>
  </section>

  <!-- ZONE -->
  <section id="zone" class="screen" hidden>
    <header class="topbar">
      <button class="tb-btn" id="btnHome">← Home</button>
      <span class="tb-title" id="zoneTitle">Number Tower</span>
      <ol class="dots" id="dots" aria-label="Progress"></ol>
      <span class="tb-score" title="Right on the first try"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg><span id="score">0</span></span>
      <button class="tb-btn" id="btnMute" aria-pressed="false">Sound on</button>
    </header>
    <main class="zone-main">
      <section class="stage" id="stage">
        <span class="stage-tag" id="stageTag">Elevator</span>
        <div class="stage-peng" id="stagePeng" data-peng="idle" data-live hidden aria-hidden="true"></div>
        <div class="stage-body" id="stageBody"></div>
      </section>
      <aside class="panel" aria-live="polite">
        <span class="q-kicker" id="qKicker"></span>
        <h2 class="q-title" id="qTitle"></h2>
        <p class="q-text" id="qText"></p>
        <div id="qOpts"></div>
        <div class="feedback" id="fb" hidden></div>
        <button class="btn-next" id="btnNext" hidden>Next</button>
        <div class="gloss" id="gloss"></div>
      </aside>
    </main>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen" hidden>
    <div class="result-card">
      <p class="eyebrow" id="resZone"></p>
      <div class="res-peng" id="resPeng" aria-hidden="true"></div>
      <div id="resStars"></div>
      <h2 id="resTitle"></h2>
      <p id="resText"></p>
      <div class="res-actions">
        <button class="btn-big" id="btnAgain">Play again</button>
        <button class="btn-ghost" id="btnResHome">Home</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const FXC = ['#f2b02e', '#2462d6', '#d9561a', '#14915c', '#ff8fa3', '#7cc4ff'];
function burst(el, n = 16) {
  if (RM || !el || !document.body.animate) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span'); s.className = 'fx';
    s.textContent = i % 3 ? '★' : '❄'; s.style.color = FXC[i % FXC.length];
    const a = Math.PI * 2 * i / n + Math.random() * .4, d = 60 + Math.random() * 90;
    document.body.appendChild(s);
    s.animate([{ transform: `translate(${cx}px,${cy}px) translate(-50%,-50%) scale(.3)`, opacity: 1 },
      { transform: `translate(${cx + Math.cos(a) * d}px,${cy + Math.sin(a) * d}px) translate(-50%,-50%) scale(1.1) rotate(${rnd(-180, 180)}deg)`, opacity: 0 }],
      { duration: 800 + Math.random() * 400, easing: 'cubic-bezier(.15,.7,.3,1)' }).onfinish = () => s.remove();
  }
}
function flyStar(el, done) {

    { transform: `translate(${x1}px,${y1}px) translate(-50%,-50%) scale(.6)` }], { duration: 850, easing: 'ease-in-out' }).onfinish = () => { s.remove(); done(); };
}
function rain(n = 40) {

}

/* ---------- sound ---------- */
let actx = null, muted = false;
function tone(freq, dur = .12, type = 'sine', vol = .08, delay = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}

  tap() { tone(420, .05, 'sine', .04); },
  step() { tone(560, .05, 'square', .02); },
  ok() { tone(660, .12); tone(880, .16, 'sine', .08, .1); },

  const tower = host.querySelector('[data-tower]'), car = host.querySelector('[data-car]'), ro = host.querySelector('[data-ro]');
  const R = { cur: 0, roHidden: false };
  R.setValue = v => { R.cur = v; car.style.setProperty('--i', 5 - v); ro.textContent = R.roHidden ? '?' : fmtP(v); };
  R.hideReadout = h => { R.roHidden = h; ro.textContent = h ? '?' : fmtP(R.cur); };
  R.hideToken = () => {};
  R.row = v => tower.querySelector(`.fl[data-v="${v}"]`);
  R.mark = (v, c) => { const r = R.row(v); if (r) r.classList.add(c); };
  R.flash = (v, c) => { const r = R.row(v); if (!r) return; r.classList.remove(c); void r.offsetWidth; r.classList.add(c); };
  R.clear = () => tower.querySelectorAll('.fl').forEach(r => r.classList.remove('ok', 'bad', 'start'));
  R.moveTo = async (to, { ms = 400, tok }) => {
    car.style.transitionDuration = Math.round(ms * .85) + 'ms';
    while (R.cur !== to) {
      R.setValue(R.cur + (to > R.cur ? 1 : -1)); sfx.step();
      await sleep(ms);
      if (tok !== Game.token) return false;

    return true;
  };
  if (o.onPick) tower.addEventListener('click', e => { const b = e.target.closest('.fl'); if (b) o.onPick(+b.dataset.v); });
  R.setValue(0);
  return R;
}

/* Thermometer: +5 °C … −5 °C */
function Thermo(host, o) {
  const top = 44, step = 36, Y = v => top + (5 - v) * step, BULB = 462, TX = 130, TW = 40;
  let ticks = '', hits = '';
  for (let v = 5; v >= -5; v--) {
    const y = Y(v), lbl = !o.sparse || v === 5 || v === 0 || v === -5;
    ticks += `<g class="tk ${sc(v)}" data-v="${v}">
      <polygon class="arrow" points="${TX - 8},${y} ${TX - 32},${y - 12} ${TX - 32},${y + 12}"/>
      <line x1="${TX + TW + 4}" x2="${TX + TW + (v === 0 ? 34 : 22)}" y1="${y}" y2="${y}"/>
      ${lbl ? `<text x="${TX + TW + 42}" y="${y}" dominant-baseline="central">${fmtP(v)} °C</text>` : ''}
      ${v === 0 && lbl ? `<text class="note" x="${TX + TW + 42}" y="${y + 18}" dominant-baseline="central">water freezes</text>` : ''}
    </g>`;
    if (o.onPick) hits += `<rect class="hit" data-v="${v}" x="0" y="${y - step / 2}" width="340" height="${step}" tabindex="0" role="button" aria-label="${fmtP(v)} degrees"/>`;
  }
  host.innerHTML = `<div class="thermo">${readoutHTML('TEMPERATURE')}
    <div class="th-wrap" data-sign="zero"><span class="th-sun"></span><span class="th-snow"></span>
    <svg class="th" viewBox="0 0 340 510" data-sign="zero" role="img" aria-label="Thermometer">
      <text class="cap" x="12" y="${Y(5) - 2}" dominant-baseline="central">WARMER</text>
      <text class="cap" x="12" y="${Y(-5) + 2}" dominant-baseline="central">COLDER</text>
      <rect class="tube" x="${TX}" y="14" width="${TW}" height="440" rx="20"/>
      <circle class="tube" cx="${TX + TW / 2}" cy="${BULB}" r="36"/>
      <rect class="liq" data-liq x="${TX + 10}" width="20" y="${Y(0)}" height="${BULB - Y(0)}" rx="4"/>
      <circle class="liq" cx="${TX + TW / 2}" cy="${BULB}" r="27"/>
      ${ticks}${hits}
    </svg><div class="th-peng">${penguin('idle', 'live')}</div></div></div>`;
  const svg = host.querySelector('svg.th'), liq = host.querySelector('[data-liq]'), ro = host.querySelector('[data-ro]');
  const wrap = host.querySelector('.th-wrap'), peng = wrap.querySelector('.peng');
  const temp = v => { const q = R.roHidden; wrap.dataset.sign = q ? 'zero' : sc(v); peng.classList.toggle('temp-cold', !q && v < 0); peng.classList.toggle('temp-hot', !q && v > 0); };
  const draw = y => { liq.setAttribute('y', y); liq.setAttribute('height', BULB - y); };
  const R = { cur: 0, roHidden: false };
  const roText = v => R.roHidden ? '?' : fmtP(v) + ' °C';
  R.setValue = v => { R.cur = v; draw(Y(v)); svg.dataset.sign = sc(v); ro.textContent = roText(v); temp(v); };
  R.hideReadout = h => { R.roHidden = h; ro.textContent = roText(R.cur); temp(R.cur); };
  R.hideToken = () => {};
  R.row = v => svg.querySelector(`.tk[data-v="${v}"]`);

/* =========================================================
   QUESTION SETS
   ========================================================= */
function crossingMove(dir) {
  for (let k = 0; k < 300; k++) {
    const s = rnd(-5, 5), d = dir * rnd(2, 6), t = s + d;
    if (t < -5 || t > 5) continue;
    if (s * t < 0) return { s, d, t };
  }
  return dir < 0 ? { s: 1, d: -5, t: -4 } : { s: -3, d: 5, t: 2 };
}
function readOptions(v) {
  const s = new Set([v]);

  shuffle([v - 1, v + 1, v - 2, v + 2, -v - 1, -v + 1, 0]).filter(x => x >= -5 && x <= 5).forEach(x => { if (s.size < 4) s.add(x); });

}
function genTower() {
  const negs = shuffle([-1, -2, -3, -4, -5]), qs = [];
  const markT = shuffle([negs[0], negs[1], negs[2], rnd(1, 5)]);
  ['elevator', 'thermo', 'line', 'elevator'].forEach((rep, i) => qs.push({ z: 'tower', type: 'mark', rep, target: markT[i] }));
  const readV = shuffle([negs[3], negs[4], rnd(1, 4)]);
  ['thermo', 'elevator', 'line'].forEach((rep, i) => qs.push({ z: 'tower', type: 'read', rep, value: readV[i], options: readOptions(readV[i]) }));
  [['elevator', -1], ['elevator', 1], ['thermo', -1], ['thermo', 1], ['line', Math.random() < .5 ? -1 : 1]].forEach(([rep, dir]) => {
    const m = crossingMove(dir);
    qs.push({ z: 'tower', type: 'move', rep, start: m.s, delta: m.d, target: m.t });
  });
  return qs;
}
function distinct(n, min, max, ok) {
  for (let k = 0; k < 800; k++) {
    const s = new Set(); while (s.size < n) s.add(rnd(min, max));
    const a = [...s]; if (!ok || ok(a)) return a;
  }

}
function genOrder() {
  const q = [];
  let a = -rnd(1, 8), b = rnd(1, 8); if (Math.random() < .5) [a, b] = [b, a];
  q.push({ z: 'order', type: 'sign', visual: true, a, b });
  let [c, d] = distinct(2, -9, -1, x => Math.abs(x[0] - x[1]) >= 2);
  q.push({ z: 'order', type: 'sign', visual: true, a: c, b: d });
  q.push({ z: 'order', type: 'pick', visual: true, want: 'greatest', nums: distinct(3, -9, -1) });
  q.push({ z: 'order', type: 'pick', visual: true, want: 'smallest', nums: distinct(3, -9, 7, x => x.filter(v => v < 0).length >= 2) });
  [c, d] = distinct(2, -10, -1);

  let e = Math.random() < .5 ? 0 : rnd(1, 9), f = -rnd(1, 9); if (Math.random() < .5) [e, f] = [f, e];
  q.push({ z: 'order', type: 'sign', visual: false, a: e, b: f });
  const mix = n => distinct(n, -10, 10, x => x.filter(v => v < 0).length >= Math.ceil(n / 2) && x.some(v => v >= 0));

function makeSeq(dir, s, nBlanks) {
  const L = s <= 3 || (s === 4 && nBlanks > 1) ? 6 : 5, d = dir * s;
  for (let k = 0; k < 3000; k++) {
    const a = rnd(-10, 10), terms = Array.from({ length: L }, (_, i) => a + i * d);
    if (terms.some(t => t < -10 || t > 10) || !terms.some(t => t > 0)) continue;
    const negIdx = terms.map((t, i) => t < 0 ? i : -1).filter(i => i > 0);
    if (negIdx.length < nBlanks || terms.filter(t => t < 0).length < nBlanks + 1) continue;
    const blanks = shuffle(negIdx).slice(0, nBlanks).sort((x, y) => x - y);
    const known = i => !blanks.includes(i);
    let pair = false;
    for (let i = 0; i < L - 1; i++) if (known(i) && known(i + 1)) pair = true;
    if (!pair) continue;

    return { z: 'seq', terms, d, s, blanks };

    return;
  }
  Game.tries++; btn.classList.add('bad'); btn.disabled = true; sfx.bad();
  if (Game.tries < 2) { setFeedback('bad', `Not quite. Start at 0 and count the ${U[q.rep].many}. Try again!`); return; }
  reveal();
  setFeedback('bad', `It shows ${nu(q.rep, q.value)}. That is ${where(q.rep, q.value)}.`);
  resolve(false);
}

/* ---------- Zone 2: Compare & Order ---------- */
function showLine(points, win) {
  setTag('Number line', false);
  const R = NumberLine(stageBody, { min: -10, max: 10 });
  R.points(points, win);
  stageBody.insertAdjacentHTML('beforeend', '');
  return R;
}
function thinkCard() {
  setTag('Think', false);
  stageBody.innerHTML = `<div class="think"><p class="think-k">No picture this time</p><p class="think-t">Picture the number line in your head.</p><div class="think-line"><span>smaller</span><i></i><span>greater</span></div></div>`;
}
function loadOrderQ(q) {
  P.kicker.textContent = `Question ${Game.i + 1} of ${Game.qs.length}${q.type === 'order' ? '' : q.visual ? ' · with number line' : ' · no picture'}`;
  if (q.type === 'sign') loadSign(q);
  else if (q.type === 'pick') loadPick(q);
  else loadBoard(q);
}
const rightSign = (a, b) => a < b ? '<' : a > b ? '>' : '=';
const signWord = s => s === '<' ? 'is less than' : s === '>' ? 'is greater than' : 'is equal to';
function compareWhy(a, b) {
  return `${num(a)} is to the <b>${a < b ? 'left' : 'right'}</b> of ${num(b)} on the number line, so ${num(a)} ${signWord(rightSign(a, b))} ${num(b)}.`;
}
function loadSign(q) {
  if (q.visual) showLine([q.a, q.b]); else thinkCard();
  P.title.textContent = 'Choose the sign';
  P.text.textContent = 'Which sign makes this true?';
  P.opts.className = 'opts stack';
  P.opts.innerHTML = `<div class="expr">${num(q.a)}<span class="slot" data-slot>?</span>${num(q.b)}</div>
    <div class="opts three">
      <button class="opt sign" data-s="<">&lt;<small>is less than</small></button>
      <button class="opt sign" data-s="=">=<small>is equal to</small></button>
      <button class="opt sign" data-s=">">&gt;<small>is greater than</small></button>
    </div>`;
  P.opts.onclick = e => {
    const b = e.target.closest('.opt'); if (!b || b.disabled || Game.done) return;
    const s = b.dataset.s, want = rightSign(q.a, q.b), slot = P.opts.querySelector('[data-slot]');
    sfx.tap();
    const finishIt = () => {
      P.opts.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.s === want) x.classList.add('ok'); });
      slot.textContent = want; slot.classList.add('filled');
      if (!q.visual) showLine([q.a, q.b]);
    };
    if (s === want) { finishIt(); sfx.ok(); setFeedback('ok', `${praise()} ${compareWhy(q.a, q.b)}`); resolve(Game.tries === 0); return; }
    Game.tries++; b.classList.add('bad'); b.disabled = true; sfx.bad();
    if (Game.tries < 2) { setFeedback('bad', 'Not quite. On the number line, the number further to the <b>left</b> is the smaller one. Try again!'); return; }
    finishIt(); setFeedback('bad', compareWhy(q.a, q.b)); resolve(false);
  };
}
function loadPick(q) {
  const want = q.want === 'greatest' ? Math.max(...q.nums) : Math.min(...q.nums);
  showLine(q.nums);
  P.title.textContent = q.want === 'greatest' ? 'Find the greatest' : 'Find the smallest';
  P.text.textContent = `Which number is the ${q.want}? Use the number line to help.`;
  P.opts.className = 'opts three';
  P.opts.innerHTML = shuffle(q.nums).map(v => `<button class="opt" data-v="${v}">${num(v)}</button>`).join('');
  const why = `The ${q.want} number is the one furthest to the <b>${q.want === 'greatest' ? 'right' : 'left'}</b>: ${num(want)}.`;
  P.opts.onclick = e => {
    const b = e.target.closest('.opt'); if (!b || b.disabled || Game.done) return;
    sfx.tap();
    const finishIt = () => { P.opts.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.v === want) x.classList.add('ok'); }); showLine(q.nums, want); };
    if (+b.dataset.v === want) { finishIt(); sfx.ok(); setFeedback('ok', `${praise()} ${why}`); resolve(Game.tries === 0); return; }
    Game.tries++; b.classList.add('bad'); b.disabled = true; sfx.bad();
    if (Game.tries < 2) { setFeedback('bad', `Not quite. Look at the number line. The ${q.want} number is furthest to the ${q.want === 'greatest' ? 'right' : 'left'}. Try again!`); return; }
    finishIt(); setFeedback('bad', why); resolve(false);
  };
}
function loadBoard(q) {
  setTag(q.dir === 'inc' ? 'Increasing order' : 'Decreasing order', false);
  const n = q.nums.length, inc = q.dir === 'inc';
  const want = [...q.nums].sort((a, b) => inc ? a - b : b - a);
  const st = { slots: Array(n).fill(null), marks: null };
  stageBody.innerHTML = `<div class="board ${n > 4 ? 'n5' : ''}">
    <div class="board-dir">${inc ? 'SMALLEST → GREATEST' : 'GREATEST → SMALLEST'}</div>
    <div class="slots" data-slots></div>
    <div class="pool" data-pool></div>
    <div class="reveal" data-reveal hidden></div></div>`;
  const slotsEl = stageBody.querySelector('[data-slots]'), poolEl = stageBody.querySelector('[data-pool]'), revealEl = stageBody.querySelector('[data-reveal]');
  P.title.textContent = inc ? 'Increasing order' : 'Decreasing order';
  P.text.innerHTML = inc ? 'Put the numbers in <b>increasing order</b>, from the smallest to the greatest.<small>Tap a number to place it. Tap it again to take it back.</small>'
                         : 'Put the numbers in <b>decreasing order</b>, from the greatest to the smallest.<small>Tap a number to place it. Tap it again to take it back.</small>';
  P.opts.className = '';
  P.opts.innerHTML = `<div class="row-actions"><button class="btn-check" id="btnCheck" disabled>Check</button><button class="btn-ghost" id="btnClear">Clear</button></div>`;
  const checkBtn = $('#btnCheck'), clearBtn = $('#btnClear');
  function render() {
    slotsEl.innerHTML = st.slots.map((k, i) => {
      const v = k == null ? null : q.nums[k];
      const cap = i === 0 ? (inc ? 'smallest' : 'greatest') : i === n - 1 ? (inc ? 'greatest' : 'smallest') : '';
      return `${i ? `<span class="rel" aria-hidden="true">${inc ? '&lt;' : '&gt;'}</span>` : ''}<div class="slot-w">
        <button class="slot ${k != null ? 'filled' : ''} ${st.marks ? st.marks[i] : ''}" data-i="${i}" ${k == null || Game.done ? 'disabled' : ''} aria-label="${k == null ? 'Empty place ' + (i + 1) : fmt(v)}">${k == null ? '' : num(v)}</button>
        <span class="slot-cap">${cap}</span></div>`;
    }).join('');
    poolEl.innerHTML = q.nums.map((v, k) => { const used = st.slots.includes(k); return `<button class="card ${used ? 'used' : ''}" data-k="${k}" ${used || Game.done ? 'disabled' : ''}>${num(v)}</button>`; }).join('');
    checkBtn.disabled = st.slots.includes(null) || Game.done;
    clearBtn.disabled = Game.done;
  }
  poolEl.onclick = e => { const b = e.target.closest('.card'); if (!b || b.disabled) return; const i = st.slots.indexOf(null); if (i < 0) return; st.slots[i] = +b.dataset.k; st.marks = null; sfx.tap(); render(); };
  slotsEl.onclick = e => { const b = e.target.closest('.slot'); if (!b || b.disabled) return; st.slots[+b.dataset.i] = null; st.marks = null; sfx.tap(); render(); };
  clearBtn.onclick = () => { if (Game.done) return; st.slots.fill(null); st.marks = null; render(); };
  const orderHTML = arr => arr.map(v => num(v)).join(`<span class="r">${inc ? '&lt;' : '&gt;'}</span>`);
  function revealAll(showRow) {
    revealEl.hidden = false;
    revealEl.innerHTML = `${showRow ? `<span class="eyebrow">Correct order</span><div class="reveal-row">${orderHTML(want)}</div>` : ''}<div data-rl style="width:100%"></div>`;
    const R = NumberLine(revealEl.querySelector('[data-rl]'), { min: -10, max: 10 });
    R.points(q.nums);
    poolEl.hidden = true;
  }
  checkBtn.onclick = () => {
    if (Game.done || st.slots.includes(null)) return;
    const got = st.slots.map(k => q.nums[k]);
    st.marks = got.map((v, i) => v === want[i] ? 'ok' : 'bad');
    if (st.marks.every(m => m === 'ok')) {
      Game.done = true; render(); sfx.ok(); revealAll(false);
      setFeedback('ok', `${praise()} ${orderHTML(want)}`);
      Game.done = false; resolve(Game.tries === 0); render();
      return;
    }
    Game.tries++; sfx.bad(); render();
    if (Game.tries < 2) { setFeedback('bad', `Some numbers are in the wrong place (red). Tap them to take them back, then try again.<small style="display:block;margin-top:.3rem">Tip: negative numbers with a bigger digit are <b>smaller</b>. ${num(-8)} &lt; ${num(-3)}</small>`); return; }
    Game.done = true; render(); revealAll(true);
    setFeedback('bad', `Here is the correct order: ${orderHTML(want)}`);
    Game.done = false; resolve(false); render();
  };
  render();
}

/* ---------- Zone 3: Sequences ---------- */
const stepTxt = q => q.d < 0 ? MINUS + q.s : '+' + q.s;
const ruleTxt = q => q.d < 0 ? `count back by ${q.s}` : `count on by ${q.s}`;
function seqLine(host, q) {
  const R = NumberLine(host, { min: -10, max: 10 });
  const { X, base } = R, arcs = R.svg.querySelector('[data-arcs]'), pts = R.svg.querySelector('[data-pts]');
  const h = 26 + q.s * 7;
  let a = '';
  for (let i = 0; i < q.terms.length - 1; i++) {
    const x0 = X(q.terms[i]), x1 = X(q.terms[i + 1]), m = (x0 + x1) / 2;
    a += `<path class="arc" data-a="${i}" d="M${x0} ${base} Q${m} ${base - 2 * h} ${x1} ${base}" style="opacity:0"/><text class="sq-step" data-t="${i}" x="${m}" y="${base - h - 16}" text-anchor="middle" style="opacity:0">${stepTxt(q)}</text>`;
  }
  arcs.innerHTML = a;
  R.dots = all => {
    pts.innerHTML = q.terms.map((t, i) => all || !q.blanks.includes(i)
      ? `<circle class="pt ${sc(t)}" cx="${X(t)}" cy="${base}" r="12"/>`
      : `<circle class="sq-blank" cx="${X(t)}" cy="${base}" r="12"/>`).join('');
  };
  R.reveal = () => { R.dots(true); R.clear(); q.blanks.forEach(i => R.mark(q.terms[i], 'ok')); };
  R.showAll = () => arcs.querySelectorAll('[data-a],[data-t]').forEach(e => { e.style.opacity = 1; });
  R.play = async (tok, ms) => {
    R.setValue(q.terms[0]);
    for (let i = 0; i < q.terms.length - 1; i++) {
      arcs.querySelector(`[data-a="${i}"]`).style.opacity = 1;
      arcs.querySelector(`[data-t="${i}"]`).style.opacity = 1;
      const x0 = X(q.terms[i]), x1 = X(q.terms[i + 1]);
      sfx.step();
      await tween(ms, p => R.place(x0 + (x1 - x0) * p, base - 4 * h * p * (1 - p)));
      if (tok !== Game.token) return false;
      R.cur = q.terms[i + 1];
      await sleep(ms * .3);
      if (tok !== Game.token) return false;
    }
    return true;
  };
  R.dots(false);
  q.blanks.forEach(i => R.mark(q.terms[i], 'start'));
  return R;
}
function loadSeqQ(q) {
  setTag(q.model ? 'Number line' : 'Find the rule', false);
  const L = q.terms.length, two = q.blanks.length > 1;
  const ent = q.blanks.map(() => ({ neg: false, dig: '', stale: false }));
  let act = 0, line = null, pipAt = 0;
  const known = i => !q.blanks.includes(i);
  const val = e => e.dig === '' ? null : (e.neg ? -1 : 1) * parseInt(e.dig, 10);
  const seqHTML = q.terms.map(t => num(t)).join(', ');
  stageBody.innerHTML = `<div class="seq">
    <div class="seq-row" data-row>${q.terms.map((t, i) => (i ? `<span class="seq-gap" data-g="${i - 1}">,</span>` : '') +
      (known(i) ? `<span class="stone">${num(t)}</span>` : `<button class="stone blank" data-i="${i}" aria-label="Missing number">?</button>`)).join('')}
      <div class="seq-pip" data-pip ${q.model ? 'hidden' : ''}>${penguin('idle', 'live')}</div></div>
    <div class="seq-line" data-line></div></div>`;
  const row = stageBody.querySelector('[data-row]'), pip = stageBody.querySelector('[data-pip]'), lineHost = stageBody.querySelector('[data-line]');
  const stoneEl = j => row.querySelector(`.stone[data-i="${q.blanks[j]}"]`);
  const pipPos = i => { const st = row.querySelectorAll('.stone')[i]; return [st.offsetLeft + st.offsetWidth / 2 - pip.offsetWidth / 2, st.offsetTop - pip.offsetHeight + 8]; };
  const placePip = () => { if (q.model) return; const [x, y] = pipPos(pipAt); pip.style.transform = `translate(${x}px,${y}px)`; };
  requestAnimationFrame(placePip); setTimeout(placePip, 350);
  Game.relayout = placePip;

  P.kicker.textContent = `Question ${Game.i + 1} of ${Game.qs.length} · ${q.model ? 'with number line' : 'find the rule'}`;
  P.title.textContent = two ? 'Missing numbers' : 'Missing number';
  P.text.innerHTML = (q.tell ? `Pip is <b>${q.d < 0 ? 'counting back' : 'counting on'} by ${q.s}</b>. What number is missing?`
    : q.model ? 'Look at Pip\'s jumps on the number line. What number is missing?'
    : `Find the rule. Then fill in the missing number${two ? 's' : ''}.`) +
    `<small>${two ? 'Tap a ? stone to choose it. ' : ''}Use the keys. Don't forget the minus sign (${MINUS}) for numbers below zero.</small>`;
  P.opts.className = '';
  P.opts.innerHTML = `<div class="seq-keys" data-kp><div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'].map(k => `<button class="key" data-k="${k}">${k}</button>`).join('')}
    <button class="key minus" data-k="neg" aria-label="Minus sign">${MINUS}</button><button class="key back" data-k="back" aria-label="Delete">&#9003;</button></div>
    <div class="row-actions"><button class="btn-check" id="btnSeqCheck" disabled>Check</button></div></div>`;
  const kp = P.opts.querySelector('[data-kp]'), chk = $('#btnSeqCheck');

  function paint() {
    ent.forEach((e, j) => {
      const el = stoneEl(j), v = val(e);
      if (!el.classList.contains('ok')) el.innerHTML = e.dig || e.neg ? `<b class="num ${v === null ? 'neg' : sc(v)}">${e.neg ? MINUS : ''}${e.dig}</b>` : '?';
      el.classList.toggle('active', j === act && !Game.done);
    });
    chk.disabled = Game.done || ent.some(e => !e.dig);
  }
  function press(k) {
    if (Game.done || Game.busy) return;
    const e = ent[act];
    if (e.stale) { e.neg = false; e.dig = ''; e.stale = false; stoneEl(act).classList.remove('bad'); }
    if (k === 'back') { if (e.dig) e.dig = e.dig.slice(0, -1); else e.neg = false; }
    else if (k === 'neg') e.neg = !e.neg;
    else if (e.dig.length < 2) e.dig = (e.dig === '0' ? '' : e.dig) + k;
    sfx.tap(); paint();
  }
  kp.onclick = e => { const b = e.target.closest('.key'); if (b) press(b.dataset.k); };
  row.onclick = e => { const b = e.target.closest('.stone.blank'); if (!b || Game.done) return; act = q.blanks.indexOf(+b.dataset.i); sfx.tap(); paint(); };
  Game.key = e => {
    if (Game.done) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === '-' || e.key === MINUS) press('neg');
    else if (e.key === 'Backspace') { e.preventDefault(); press('back'); }
    else if (e.key === 'Enter') { e.preventDefault(); chk.click(); }
    else if (e.key === 'Tab' && two) { e.preventDefault(); act = (act + 1) % ent.length; paint(); }
  };
  function hint(vals, good) {
    const j = good.indexOf(false), v = vals[j], a = q.terms[q.blanks[j]];
    if (Math.abs(v) === Math.abs(a)) return `Check the sign! This number is <b>below zero</b>, so it needs a minus sign (${MINUS}). Try again!`;
    if (q.model) return `Not quite. Count ${q.d < 0 ? 'back' : 'on'} by ${q.s} each time. Follow Pip's jumps on the number line. Try again!`;
    let i0 = 0; while (!(known(i0) && known(i0 + 1))) i0++;
    return `Not quite. Find the rule first: how do you get from ${num(q.terms[i0])} to ${num(q.terms[i0 + 1])}? Then make the same jump each time. Try again!`;
  }
  async function stoneHop(tok, ms) {
    const gaps = row.querySelectorAll('.seq-gap');
    for (let i = 0; i < L - 1; i++) {
      gaps[i].classList.add('on'); gaps[i].innerHTML = `<span>${stepTxt(q)}</span>`;
      const [x0, y0] = pipPos(i), [x1, y1] = pipPos(i + 1);
      sfx.step();
      await tween(ms, p => { pip.style.transform = `translate(${x0 + (x1 - x0) * p}px,${y0 + (y1 - y0) * p - 200 * p * (1 - p)}px)`; });
      if (tok !== Game.token) return;
      pipAt = i + 1;
      await sleep(ms * .3);
      if (tok !== Game.token) return;
    }
  }
  function finishSeq(ok) {
    const tok = Game.token;
    q.blanks.forEach((bi, j) => { const el = stoneEl(j); el.classList.remove('bad', 'active'); el.classList.add('ok'); el.innerHTML = num(q.terms[bi]); });
    kp.hidden = true;
    if (ok) sfx.ok();
    setFeedback(ok ? 'ok' : 'bad', ok ? `${praise()} The rule is <b>${ruleTxt(q)}</b>.<br>${seqHTML}` : `The rule is <b>${ruleTxt(q)}</b>, so the sequence is:<br>${seqHTML}`);
    resolve(ok && Game.tries === 0);
    if (q.model) { line.reveal(); return; }
    line = seqLine(lineHost, q); line.hideToken(); line.reveal(); line.showAll();
    stoneHop(tok, D(480));
  }
  chk.onclick = () => {
    if (Game.done || Game.busy || ent.some(e => !e.dig)) return;
    const vals = ent.map(val), good = vals.map((v, j) => v === q.terms[q.blanks[j]]);
    if (good.every(Boolean)) { finishSeq(true); return; }
    Game.tries++; sfx.bad();
    good.forEach((g, j) => { const el = stoneEl(j); el.classList.remove('bad'); if (!g) { void el.offsetWidth; el.classList.add('bad'); ent[j].stale = true; } });
    act = good.indexOf(false); paint();
    if (Game.tries < 2) { setFeedback('bad', hint(vals, good)); return; }
    finishSeq(false);
  };
  paint();
  if (q.model) {
    line = seqLine(lineHost, q);
    line.setValue(q.terms[0]);
    const tok = Game.token;
    sleep(D(500)).then(() => { if (tok === Game.token) line.play(tok, D(560)); });
  }
}
document.addEventListener('keydown', e => { if (Game.key && !$('#zone').hidden) Game.key(e); });
window.addEventListener('resize', () => { if (Game.relayout && !$('#zone').hidden) Game.relayout(); });

/* ---------- wiring ---------- */
$('#btnStart').onclick = () => { sfx.tap(); renderBest(); show('home'); };
$('#doorTower').onclick = () => { sfx.tap(); startZone('tower'); };
$('#doorOrder').onclick = () => { sfx.tap(); startZone('order'); };
$('#doorSeq').onclick = () => { sfx.tap(); startZone('seq'); };
$('#btnHome').onclick = () => { Game.token++; renderBest(); show('home'); };
$('#btnNext').onclick = () => { sfx.tap(); next(); };
$('#btnAgain').onclick = () => startZone(Game.zone);
$('#btnResHome').onclick = () => { renderBest(); show('home'); };
$('#btnMute').onclick = e => { muted = !muted; e.currentTarget.textContent = muted ? 'Sound off' : 'Sound on'; e.currentTarget.setAttribute('aria-pressed', String(muted)); };
document.querySelectorAll('[data-peng]').forEach(el => { el.innerHTML = penguin(el.dataset.peng, el.hasAttribute('data-live') ? 'live' : ''); });
show('intro');
})();
</script>
